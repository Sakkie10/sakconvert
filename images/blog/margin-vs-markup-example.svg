<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Margin and markup worked example</title>
  <desc id="desc">A SakConvert visual showing cost price, selling price, profit, margin, and markup in one worked example.</desc>

  <rect width="1200" height="630" fill="#050608"/>

  <circle cx="1010" cy="140" r="180" fill="#0A50FE" opacity="0.13"/>
  <circle cx="140" cy="520" r="180" fill="#0A50FE" opacity="0.09"/>

  <text x="70" y="78" fill="#7EA2FF" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="3">
    WORKED EXAMPLE
  </text>

  <text x="70" y="138" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="800">
    Cost 60 → Price 100
  </text>

  <text x="70" y="178" fill="#A7B0C0" font-family="Arial, Helvetica, sans-serif" font-size="24">
    Profit is 40, but margin and markup are not the same.
  </text>

  <rect x="70" y="230" width="420" height="260" rx="26" fill="#0B1220" stroke="#1E2A44" stroke-width="2"/>

  <text x="110" y="285" fill="#A7B0C0" font-family="Arial, Helvetica, sans-serif" font-size="24">
    Cost Price
  </text>
  <text x="390" y="285" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" text-anchor="end">
    60
  </text>

  <line x1="110" y1="315" x2="450" y2="315" stroke="#1E2A44" stroke-width="2"/>

  <text x="110" y="365" fill="#A7B0C0" font-family="Arial, Helvetica, sans-serif" font-size="24">
    Selling Price
  </text>
  <text x="390" y="365" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" text-anchor="end">
    100
  </text>

  <line x1="110" y1="395" x2="450" y2="395" stroke="#1E2A44" stroke-width="2"/>

  <text x="110" y="445" fill="#A7B0C0" font-family="Arial, Helvetica, sans-serif" font-size="24">
    Profit
  </text>
  <text x="390" y="445" fill="#0A50FE" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" text-anchor="end">
    40
  </text>

  <rect x="540" y="230" width="590" height="115" rx="24" fill="#0B1220" stroke="#1E2A44" stroke-width="2"/>
  <text x="580" y="278" fill="#A7B0C0" font-family="Arial, Helvetica, sans-serif" font-size="22">
    Profit Margin
  </text>
  <text x="580" y="322" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="800">
    40 ÷ 100 = 40%
  </text>

  <rect x="540" y="375" width="590" height="115" rx="24" fill="#0B1220" stroke="#1E2A44" stroke-width="2"/>
  <text x="580" y="423" fill="#A7B0C0" font-family="Arial, Helvetica, sans-serif" font-size="22">
    Markup
  </text>
  <text x="580" y="467" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="800">
    40 ÷ 60 = 66.67%
  </text>

  <rect x="70" y="535" width="1060" height="54" rx="18" fill="#0A50FE"/>
  <text x="105" y="570" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">
    Margin uses selling price. Markup uses cost price.
  </text>
</svg>